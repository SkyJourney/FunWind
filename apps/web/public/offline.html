<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0e7490" />
    <title>暂时离线 · 青翼字幕组</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "PingFang SC",
          sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #0f172a;
        background: #f8fafc;
      }
      main {
        width: min(100%, 420px);
        padding: 32px;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        color: #fff;
        background: #0e7490;
        border-radius: 16px;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        margin: 0;
        font-size: 22px;
      }
      p {
        color: #64748b;
        line-height: 1.6;
      }
      button {
        margin-top: 8px;
        padding: 10px 18px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #0e7490;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body {
          color: #f1f5f9;
          background: #020617;
        }
        main {
          background: #0f172a;
          border-color: #1e293b;
        }
        p {
          color: #94a3b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">翼</div>
      <h1>暂时离线</h1>
      <p>当前网络不可用。页面内容不会在设备上缓存，请联网后重试以安全读取最新内容。</p>
      <button type="button" onclick="location.reload()">重新连接</button>
    </main>
  </body>
</html>
