# FunWind · 本机容器验证用 nginx 主配置（生产不用——生产是宝塔系统级 nginx，D7）
# 验证内容：redirect-map.conf 的 301/410 全部断言（e2e-prod/legacy-redirect.spec.ts）。
# 占位 server_name，请求须带 Host: www.example.test；容器内无上游 SSR，应用路径返回 502 属预期——
# 用例只断言映射层（301/410/robots 透传），不断言应用页状态。

worker_processes auto;
error_log /var/log/nginx/error.log warn;
events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;

    # 生产环境由宝塔 0.websocket.conf 提供；验证容器自带等价定义
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # 301/410 映射表（与生产同一份文件；http 层 include，与生产 vhost 结构一致）
    include /etc/nginx/conf.d/redirect-map.conf;

    server {
        listen 80;
        # 生产是 qingyisub.top / www.qingyisub.top；本机用占位域，避免与真站混淆
        server_name www.example.test;
        # Location 输出相对 URL（与生产 vhost 同配置）
        absolute_redirect off;

        # 旧 phpwind URL 处置（与生产 funwind.conf 的 443 server 同构；顺序固定：301 优先于 410）
        if ($legacy_target != "") {
            return 301 $legacy_target;
        }
        if ($legacy_gone) {
            return 410;
        }

        # 应用反代（验证容器里上游不存在 → 502；用例不断言这些路径的状态）
        client_max_body_size 64m;
        location = /api/health {
            proxy_pass http://127.0.0.1:3311;
            access_log off;
        }
        location / {
            proxy_pass http://127.0.0.1:3311;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
