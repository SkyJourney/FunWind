# FunWind · 宝塔 nginx vhost 目标形态（上线时替换 www.qingyisub.top.conf）
# ==================================================================
# 用法（D7 拓扑，站长在服务器执行，见 LAUNCH-RUNBOOK）：
#   备份旧 conf → 本文件替换 /www/server/panel/vhost/nginx/www.qingyisub.top.conf
#   → nginx -t → nginx -s reload
# 结构：http→https 301 与裸域→www 301 → 301/410 映射表 → 反代 SSR 容器。
# 与旧 conf 的差异：root/PHP 段移除（旧栈退役后不存在）、加 client_max_body_size 64m（M13-3）、
# 加 /api/health 反代豁免日志、静态缓存段改为反代版（JS/CSS 走应用 Cache-Control）。
# map 段（redirect-map）必须在 http 层：宝塔 nginx.conf 的 vhost include 位于 http 块内，
# 因此本文件的 include 写在 server 块之前是合法的 http 层位置。

# ---------- 301/410 映射表（map 段，http 层；部署时上传为 funwind-redirect-map.conf） ----------
include /www/server/panel/vhost/nginx/funwind-redirect-map.conf;

# ---------- 80：只做跳转 ----------
server {
    listen 80;
    server_name qingyisub.top www.qingyisub.top;
    # ACME http-01 验证目录保留（证书续期不经过跳转）
    include /www/server/panel/vhost/nginx/well-known/www.qingyisub.top.conf;
    # Location 输出相对 URL（RFC 7231；与映射表的相对目标一致，断言/日志都简洁）
    absolute_redirect off;
    location / {
        return 301 https://www.qingyisub.top$request_uri;
    }
}

# ---------- 443：主服务 ----------
server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name qingyisub.top www.qingyisub.top;
    index index.html;

    # TLS：沿用既有证书路径（宝塔申请/续期不变）
    ssl_certificate    /www/server/panel/vhost/cert/www.qingyisub.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/www.qingyisub.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;    # 旧 conf 的 TLSv1.1 已废弃（PCI/现代基线），移除
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:EECDH+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    # HSTS 交由应用层按 APP_URL 下发（next security-headers，含 15552000 秒）——nginx 不重复下发

    # 证书申请验证目录
    include /www/server/panel/vhost/nginx/well-known/www.qingyisub.top.conf;

    # 旧 phpwind URL 处置（redirect-map 的两个 map 变量；顺序固定：301 优先于 410）
    if ($legacy_target != "") {
        return 301 $legacy_target;
    }
    if ($legacy_gone) {
        return 410;
    }

    # 反代 SSR 容器（127.0.0.1:3311，docker/production/compose.yaml）
    client_max_body_size 64m;    # M13-3：上传体积上限（G-17 多实例清单的 nginx 配置动作）
    client_body_timeout 60s;

    # 健康检查：反代但不记访问日志（外部拨测高频打点）
    location = /api/health {
        proxy_pass http://127.0.0.1:3311;
        access_log off;
    }

    # 运维任务管线的内部动作接口（M14 D8）：仅 funwind-internal 网内可达（管线 → 应用容器），
    # 公网一律 404——三保险的第一层（第二层 token、第三层 campaigns 写服务校验）
    location /api/internal/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3311;
        proxy_http_version 1.1;
        # 传递真实客户端信息（应用 TRUSTED_PROXY_HOPS=1 据此取 Client IP——M12 F3）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/流式（通知/上传进度）：禁缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
        # WebSocket 升级头（预留）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    access_log /www/wwwlogs/www.qingyisub.top.log;
    error_log  /www/wwwlogs/www.qingyisub.top.error.log;
}
