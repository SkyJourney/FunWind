# FunWind · 旧 phpwind URL → 新论坛 301/410 映射表（权威表）
# ================================================================
# 依据（探查实录见 docs/milestones/M13-launch.md §1 F1/F12，上线后 BLUEPRINT 实录回写）：
#   · id 恒等迁移：新 tid/pid/fid/uid = 旧值，纯静态映射、不查库（BLUEPRINT §4.5 M3 冻结）
#   · 旧站真实 URL 形态取自 QY_HK 宝塔线上 access log 聚合（200 状态过滤 + 数字归一，非猜测）：
#     read.php?tid=N(&fid=N)(&page=N) / index.php?m=bbs&c=thread&fid=N /
#     index.php?m=bbs&c=read&a=jump&tid=N&pid=N / ?uid=N / ?pid=N / index.php?m=space&uid=N / u.php?uid=N
#   · BLUEPRINT §4.5 写的 simple/?t=N 与 space/?uid=N 两形态在旧站文件与日志均不存在（勘误记录：
#     simple 的真实形态是 phpwind 8 风格 simple/?t{tid}.html——本表按 file-level 复核收录）
#   · 楼层页码不透传：旧站首帖占第 1 页且 read.perpage=10（每页 replies+1 行），新站首帖常驻每页、
#     20 楼/页——页码语义不同。精确到楼走 /p/{pid}（服务端按观众可见性算页码 + #p{pid} 锚点）；
#     只带 tid 的深页链接跳第 1 页（诚实降级，页内可继续翻）
#   · 主题分类前缀恒等迁移（migration transform prefixIds 直通）→ 版块 ?type= 直传；
#     旧搜索参数 keyword → 新站 /search?q=
#   · 410 Gone 原则：正文/表情已在迁移期改写为 /files/**、/emoji/**；attachment 头像可精确换算
#     /u/{uid}（路径含 uid 段），其余附件无法从旧路径反查新 key → 410；一切旧 .php 入口兜底 410
#
# 用法：server 块内两个 if（见 funwind.conf）；include 本文件须在 server 上下文（map 指令必须在 http 层，
# 宝塔下本文件被 vhost include 时位于 http>server 内——map 不允许嵌在 server！
# 因此生产接入方式：map 段放 /www/server/panel/vhost/nginx/funwind-redirect-map.conf（http 层 include），
# if 段放 vhost server 块内。见 nginx.conf 接入注释。）
# 本机验证：e2e-prod/legacy-redirect.spec.ts（占位域名 + Host 头，≥20 条用例）

# ---------- 301 目标表（first match wins；命名捕获跨变量不可用，位置捕获 $1 即目标） ----------
map $request_uri $legacy_target {
    default "";

    # 帖子（旧站主力形态；页码/冗余 fid 不透传）
    "~^/read\.php\?tid=([1-9][0-9]{0,9})"                  /t/$1;
    # 旧站「定位到楼」入口 → /p/{pid}：服务端按观众可见性算页码 + 锚点（体验精确等价）
    "~^/index\.php\?m=bbs&c=read&a=jump&tid=[1-9][0-9]{0,9}&pid=([1-9][0-9]{0,9})"  /p/$1;
    "~^/index\.php\?(?:[^&]+&)*pid=([1-9][0-9]{0,9})"      /p/$1;
    # 站内跳楼短链 /?pid=N（query-only 变体，日志实录）
    "~^/\?pid=([1-9][0-9]{0,9})"                           /p/$1;
    # 版块（c=thread 形态；?type= 直传——主题分类前缀恒等迁移；a=list 无 fid 是版块列表 → 首页）
    "~^/index\.php\?m=bbs&c=thread&fid=([1-9][0-9]{0,9})&type=([1-9][0-9]{0,9})"  /f/$1?type=$2;
    "~^/index\.php\?m=bbs&c=thread&fid=([1-9][0-9]{0,9})"                     /f/$1;
    "~^/thread\.php\?fid=([1-9][0-9]{0,9})&type=([1-9][0-9]{0,9})"                /f/$1?type=$2;
    "~^/thread\.php\?fid=([1-9][0-9]{0,9})"                                   /f/$1;
    # 用户（三种形态 + 旧头像路径按 uid 段精确换算；旧「个人空间」带 uid 的直接进用户页）
    "~^/(?:u\.php\?uid|\?uid)=([1-9][0-9]{0,9})"           /u/$1;
    "~^/index\.php\?m=space&(?:c=[a-z]+&)?uid=([1-9][0-9]{0,9})"  /u/$1;
    "~^/attachment/avatar/[0-9]{3}/[0-9]{2}/[0-9]{2}/([1-9][0-9]{0,9})[^?]*$"  /u/$1;
    # phpwind 8 simple 无图模式：simple/?t123.html / simple/?f45.html（-页码 丢弃）
    "~^/simple/\?([tf])([1-9][0-9]{0,9})(?:-[0-9]+)?\.html$"  /$1/$2;
    # 站级入口（日志高频：裸 index.php 447 次、m=bbs 333 次、c=forumlist 两种参数序 248+92 次）
    "~^/index\.php\??$"                                      /;
    "~^/index\.php\?m=bbs$"                                  /;
    # 旧「版块列表」页 → 新站版块目录（语义精确对应；旧站 homeUrl 也指向此路由）
    "~^/index\.php\?(?:m=bbs&c=forumlist|c=forumlist&m=bbs)(?:&|$)"  /boards;
    "~^/index\.php\?m=bbs&c=forum&a=list(?:&|$)"            /boards;
    "~^/index\.php\?m=u&c=login"                       /login;
    "~^/index\.php\?m=u&c=register"                    /register;
    "~^/index\.php\?m=u&c=findPwd"                     /forgot;
    # 旧搜索（keyword → q；剩余参数丢弃）
    "~^/index\.php\?m=search&c=s&keyword=([^&]+)"      /search?q=$1;
}

# ---------- 410 标记表（在 301 落空后才判定；funwind.conf 里 if 顺序保证） ----------
map $request_uri $legacy_gone {
    default 0;

    # 已退役资源目录（正文/表情/头像迁移后新站内部不再出现）
    "~^/attachment/"   1;
    "~^/emotion/"      1;
    "~^/res/"          1;
    "~^/themes/"       1;
    "~^/images/"       1;
    # 一切旧 .php 入口兜底 410（含 register.php/login.php/post.php/rss.php/sitemap.php 等
    # 全部 phpwind 入口——上面 301 表未接住的都到这里）
    "~^/[^?]*\.php(\?|$)"  1;
}
