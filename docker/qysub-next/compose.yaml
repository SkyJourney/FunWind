# qysub-next · 新论坛 MySQL 8 LTS（与旧只读副本实例完全隔离）
# 旧库：qingyisub-mysql @ 127.0.0.1:33620（mysql 5.7，GBK，只读红线）
# 新库：qysub-next-mysql @ 127.0.0.1:33621（mysql 8.4 LTS，utf8mb4，InnoDB）
name: qysub-next

services:
  mysql:
    image: mysql:8.4
    container_name: qysub-next-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:33621:3306"
    environment:
      # 口令只放在不入库的根 .env（NEW_DB_PASSWORD），不要写进本文件。
      # 启动：docker compose --env-file .env -f docker/qysub-next/compose.yaml up -d
      - MYSQL_ROOT_PASSWORD=${NEW_DB_PASSWORD:?请先在仓库根 .env 设置 NEW_DB_PASSWORD}
      - MYSQL_DATABASE=qysub_next
    command:
      - --character-set-server=utf8mb4
      # M13 起家族默认从 0900_ai_ci（MySQL 8 专有）切换为全家族可移植的 utf8mb4_unicode_ci；
      # 三列 _bin（username_key/email_key/gate_key）与 rehearsal username 的 _as_cs 由各自显式定义保证
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - /Volumes/Docker/data/qysub-next/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
